[project]
name = "aequitas-backend"
version = "0.1.0"
description = "Aequitas AI backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.1.0",
    "supabase>=2.31.0",
    "pydantic-ai-slim[openai]>=2.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: requires live Supabase/Openrouter credentials and local ML models, run manually only"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
